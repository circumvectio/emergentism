name = "emergentism_check"
defaultTargets = ["EmergentismCheck"]

# r183 (`183_THE_MANIFEST_AUDITED_ITSELF_AND_FAILED_2026_07_29.md`): this
# project file was ABSENT. The corpus's copy of EmergentismCheck.lean
# could not be built at all — `lake build` had no target — while
# check_established.py reported PASS by counting the string "^theorem ".
# A Lean file whose every theorem was replaced with a false one would have passed.

[[require]]
name = "mathlib"
scope = "leanprover-community"

[[lean_lib]]
name = "EmergentismCheck"
srcDir = "."
