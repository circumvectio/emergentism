<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Emergentism — a worldview for finite beings</title>
  <desc id="desc">A fallible map opens possible futures, passes through a Finity into an actual move, and records an observed outcome that revises the map.</desc>
  <defs>
    <radialGradient id="blueGlow" cx="88%" cy="0%" r="88%">
      <stop offset="0" stop-color="#79A8FF" stop-opacity=".18"/>
      <stop offset=".62" stop-color="#79A8FF" stop-opacity=".02"/>
      <stop offset="1" stop-color="#070A12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="44%" cy="48%" r="50%">
      <stop offset="0" stop-color="#F0C85A" stop-opacity=".12"/>
      <stop offset="1" stop-color="#F0C85A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="returnLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5F0E6" stop-opacity=".12"/>
      <stop offset=".48" stop-color="#F0C85A" stop-opacity=".8"/>
      <stop offset="1" stop-color="#72D6C0" stop-opacity=".5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#070A12"/>
  <rect width="1200" height="630" fill="url(#blueGlow)"/>
  <rect width="1200" height="630" fill="url(#goldGlow)"/>
  <text x="600" y="604" fill="#F5F0E6" fill-opacity=".021" font-family="Arial, sans-serif" font-size="180" font-weight="800" letter-spacing="-10" text-anchor="middle">EMERGENTISM</text>

  <text x="74" y="69" fill="#F5F0E6" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="7">EMERGENTISM</text>
  <text x="1126" y="69" fill="#F0C85A" font-family="monospace" font-size="14" letter-spacing="2" text-anchor="end">A WORLDVIEW FOR FINITE BEINGS</text>

  <text x="74" y="172" fill="#F5F0E6" font-family="Georgia, serif" font-size="62" letter-spacing="-2">Reality exceeds every map.</text>
  <text x="74" y="241" fill="#F0C85A" font-family="Georgia, serif" font-size="62" font-style="italic" letter-spacing="-2">We still have to act.</text>
  <text x="78" y="287" fill="#C0C1C5" font-family="Arial, sans-serif" font-size="19" font-weight="300">A fallibilist worldview and practical compass. Finity is its first practice.</text>

  <text x="600" y="344" fill="#79A8FF" font-family="monospace" font-size="12" font-weight="700" letter-spacing="3" text-anchor="middle">TERRITORY  ↓</text>

  <rect x="74" y="371" width="220" height="82" fill="#0C1220" stroke="#F5F0E6" stroke-opacity=".22"/>
  <rect x="339" y="371" width="220" height="82" fill="#0C1220" stroke="#79A8FF" stroke-opacity=".7"/>
  <rect x="604" y="371" width="180" height="82" fill="#0C1220" stroke="#F0C85A" stroke-width="2"/>
  <rect x="829" y="371" width="297" height="82" fill="#0C1220" stroke="#72D6C0" stroke-opacity=".7"/>

  <text x="184" y="419" fill="#F5F0E6" font-family="monospace" font-size="15" font-weight="700" letter-spacing="1.5" text-anchor="middle">FALLIBLE MAP</text>
  <text x="449" y="419" fill="#79A8FF" font-family="monospace" font-size="15" font-weight="700" letter-spacing="1.5" text-anchor="middle">POSSIBLE FUTURES</text>
  <circle cx="644" cy="412" r="18" fill="none" stroke="#F0C85A" stroke-width="2"/>
  <circle cx="644" cy="412" r="4" fill="#F0C85A"/>
  <text x="721" y="419" fill="#F0C85A" font-family="monospace" font-size="15" font-weight="700" letter-spacing="1.5" text-anchor="middle">FINITY</text>
  <text x="978" y="419" fill="#72D6C0" font-family="monospace" font-size="15" font-weight="700" letter-spacing="1.5" text-anchor="middle">ACTUAL MOVE</text>

  <text x="316" y="421" fill="#959CAB" font-family="monospace" font-size="24" text-anchor="middle">→</text>
  <text x="581" y="421" fill="#959CAB" font-family="monospace" font-size="24" text-anchor="middle">→</text>
  <text x="806" y="421" fill="#959CAB" font-family="monospace" font-size="24" text-anchor="middle">→</text>

  <path d="M 1098 471 C 1098 520, 870 532, 600 532 C 330 532, 102 520, 102 471" fill="none" stroke="url(#returnLine)" stroke-width="2"/>
  <path d="M 102 471 l -7 12 l 14 0 z" fill="#F5F0E6" fill-opacity=".55"/>
  <text x="600" y="523" fill="#F0C85A" font-family="monospace" font-size="13" font-weight="700" letter-spacing="2" text-anchor="middle">REVISE  ←  OBSERVED OUTCOME</text>

  <text x="74" y="583" fill="#C0C1C5" font-family="Arial, sans-serif" font-size="18">The map proposes. The world constrains the reply.</text>
  <text x="1126" y="583" fill="#959CAB" font-family="monospace" font-size="13" letter-spacing="1" text-anchor="end">BENEFIT UNTESTED · NO BELIEF REQUIRED · EXIT OPEN</text>
</svg>
