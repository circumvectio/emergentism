<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Emergentism — fluency is not emergence</title>
  <desc id="desc">A technical claim-churning loop carries a sourced seed through candidate, rival, test, receipt, disposition, revision, and a retained grave.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#F5F0E6" stroke-opacity=".045"/>
    </pattern>
    <radialGradient id="glow" cx="86%" cy="4%" r="82%">
      <stop offset="0" stop-color="#79A8FF" stop-opacity=".17"/>
      <stop offset=".72" stop-color="#79A8FF" stop-opacity=".015"/>
      <stop offset="1" stop-color="#070A12" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#79A8FF"/></marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#F0C85A"/></marker>
    <marker id="arrow-faint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#959CAB"/></marker>
  </defs>

  <rect width="1200" height="630" fill="#070A12"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <text x="68" y="58" fill="#F5F0E6" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="6">EMERGENTISM</text>
  <text x="1132" y="58" fill="#F0C85A" font-family="monospace" font-size="13" letter-spacing="2" text-anchor="end">PLATE 01 · ONTOLOGY-CHURN INSTRUMENT</text>
  <text x="68" y="137" fill="#F5F0E6" font-family="Georgia, serif" font-size="58" letter-spacing="-2">Fluency is not</text>
  <text x="68" y="201" fill="#F0C85A" font-family="Georgia, serif" font-size="58" font-style="italic" letter-spacing="-2">emergence.</text>
  <text x="70" y="240" fill="#C0C1C5" font-family="Arial, sans-serif" font-size="18">An open ontology seed for humans and frontier models.</text>
  <text x="1132" y="240" fill="#F0C85A" font-family="monospace" font-size="12" letter-spacing="1.4" text-anchor="end">[I] SUCCESSOR CHALLENGE</text>

  <g fill="none" stroke="#79A8FF" stroke-width="2" marker-end="url(#arrow-blue)">
    <path d="M190 332H225"/><path d="M375 332H410"/><path d="M560 332H595"/><path d="M725 332H760"/><path d="M900 332H935"/>
  </g>
  <path d="M1005 382V445H300V382" fill="none" stroke="#F0C85A" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-gold)"/>
  <path d="M1072 382V482" fill="none" stroke="#959CAB" stroke-width="1.5" stroke-dasharray="4 6" marker-end="url(#arrow-faint)"/>

  <g font-family="monospace">
    <g transform="translate(68 282)"><rect width="122" height="100" fill="#0C1220" stroke="#F0C85A"/><text x="12" y="24" fill="#F0C85A" font-size="12">00</text><text x="61" y="54" fill="#F5F0E6" font-size="15" text-anchor="middle">SEED</text><text x="61" y="75" fill="#959CAB" font-size="10" text-anchor="middle">SOURCE + TIER</text></g>
    <g transform="translate(225 282)"><rect width="150" height="100" fill="#0C1220" stroke="#F5F0E6" stroke-opacity=".34"/><text x="12" y="24" fill="#F0C85A" font-size="12">01</text><text x="75" y="54" fill="#F5F0E6" font-size="15" text-anchor="middle">CANDIDATE</text><text x="75" y="75" fill="#959CAB" font-size="10" text-anchor="middle">ACCOUNT</text></g>
    <g transform="translate(410 282)"><rect width="150" height="100" fill="#0C1220" stroke="#F5F0E6" stroke-opacity=".34"/><text x="12" y="24" fill="#F0C85A" font-size="12">02</text><text x="75" y="54" fill="#F5F0E6" font-size="15" text-anchor="middle">RIVAL</text><text x="75" y="75" fill="#959CAB" font-size="10" text-anchor="middle">STRONGEST</text></g>
    <g transform="translate(595 282)"><rect width="130" height="100" fill="#0C1220" stroke="#F5F0E6" stroke-opacity=".34"/><text x="12" y="24" fill="#F0C85A" font-size="12">03</text><text x="65" y="54" fill="#F5F0E6" font-size="15" text-anchor="middle">TEST</text><text x="65" y="75" fill="#959CAB" font-size="10" text-anchor="middle">DISCRIMINATE</text></g>
    <g transform="translate(760 282)"><rect width="140" height="100" rx="50" fill="#0C1220" stroke="#72D6C0"/><text x="16" y="24" fill="#F0C85A" font-size="12">04</text><text x="70" y="54" fill="#F5F0E6" font-size="15" text-anchor="middle">RECEIPT</text><text x="70" y="75" fill="#959CAB" font-size="10" text-anchor="middle">WORLD CONTACT</text></g>
    <g transform="translate(935 282)"><rect width="197" height="100" fill="#0C1220" stroke="#F0C85A"/><text x="14" y="24" fill="#F0C85A" font-size="12">05</text><text x="98" y="54" fill="#F5F0E6" font-size="15" text-anchor="middle">DISPOSITION</text><text x="98" y="75" fill="#959CAB" font-size="10" text-anchor="middle">CONTINUE · REVISE · STOP</text></g>
    <g transform="translate(952 494)"><rect width="180" height="54" fill="#0C1220" stroke="#959CAB"/><text x="12" y="21" fill="#F0C85A" font-size="11">G</text><text x="90" y="34" fill="#F5F0E6" font-size="13" text-anchor="middle">GRAVE RETAINED</text></g>
    <text x="476" y="435" fill="#F0C85A" font-size="11" letter-spacing="1">REVISION → SEED v+1</text>
    <text x="68" y="584" fill="#C0C1C5" font-size="13">NOTHING PROMOTES ITSELF · AMRITA IS A TARGET LABEL, NOT AN ATTAINED RESULT</text>
    <text x="1132" y="584" fill="#959CAB" font-size="12" text-anchor="end">CORRECTION VISIBLE · EXIT OPEN</text>
  </g>
</svg>
