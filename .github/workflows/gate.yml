# THE GATE — CI. This is the enforcement a pre-commit hook cannot provide,
# because `git commit --no-verify` bypasses hooks and this repository's own
# maintainers use it routinely. CI cannot be skipped from a laptop.
#
# Installed 2026-07-29 (r183, `183_THE_MANIFEST_AUDITED_ITSELF_AND_FAILED_2026_07_29.md`).
# Until this date the corpus had five validators and NOTHING RAN THEM — r177 (`177_WP1_DEFECTIVE_VALIDATOR_HARDENED_2026_07_29.md`)'s HOLE 0, open since 2026-07-27.

name: gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Emergentism
        uses: actions/checkout@v4
        with:
          # The contact-limited receipt ratchet compares HEAD with its first
          # parent. Depth 1 would make immutable receipt custody unverifiable.
          fetch-depth: 2
          # Gate scripts need tree access only; do not leave a write-capable
          # credential in the checkout used to execute repository code.
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run the gate
        # The Lean toolchain is not installed on CI, so the Lean half of
        # check_established.py cannot be re-verified here. That is acknowledged
        # EXPLICITLY rather than silently passed — the checker prints a loud NOTE
        # and the structural checks (project files, theorem count, no sorry) still run.
        env:
          EMERGENTISM_SKIP_LEAN: '1'
          # Skyzai is private and byte disclosure is not authorized. This mode
          # validates all declared paths, lifecycle values, and SHA-256 syntax,
          # while marking byte replay unavailable. If an authorized federation
          # is configured, exact bytes remain mandatory and mismatches fail.
          EMERGENTISM_ALLOW_UNAVAILABLE_EXTERNAL_SOURCES: '1'
        run: bash 09_TOOLS/01_SCRIPTS/gate.sh

      - name: Report what CI did NOT verify
        if: always()
        run: |
          echo "::notice title=Unverified on CI::The Lean proofs are NOT re-run here."
          echo "A full 'lake build' requires fetching mathlib and is impractical in CI."
          echo "Receipt 182 (182_C_HAT_IS_NOT_A_RING_MACHINE_CHECKED_2026_07_29.md) records the build output and axiom traces. The generative"
          echo "base (G1-G10) IS recomputed by exhaustion on every run."
          echo "::notice title=External source replay unavailable::Six private Skyzai source files were not fetched or replayed. CI validated their declared metadata and hash pins only; an authorized local federation must replay the exact bytes."
