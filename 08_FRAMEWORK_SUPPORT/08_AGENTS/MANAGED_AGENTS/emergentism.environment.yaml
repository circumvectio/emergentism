# Emergentism Managed Agents — shared cloud environment
# Legacy-named environment reused only by hosted operational L1-L4. L5-L7 remain
# non-deployable counsel and are never persistent hosted agents. Each session provisions a
# container from this template. Mount the Magnum Opus repo per-session as a
# github_repository resource (see README §Runtime).
name: emergentism-seven
description: "Shared cloud container for operational Rosetta seats L1-L4; boundary rows L5-L7 are not hosted."
config:
  type: cloud
  networking:
    # Hosted L2/L3 use web_search / web_fetch. Tighten to `limited` + allowed_hosts to lock egress.
    type: unrestricted
metadata:
  framework: "Emergentism"
  purpose: "four-seat operational Rosetta ensemble"
