  layers) even as you tombstone the surface. K3: move + tombstone,
  never delete. The 2026-07-12 disposition is the active route card;
  prior route cards are K3 provenance, not active authority.

  ROSETTA ROW (2026-07-23):
  Varṇa **Sādhu** · Pramāṇa **First Principles (Anupalabdhi /
