<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 462" role="img" aria-labelledby="mtitle mdesc">
<title id="mtitle">The Rosetta meridian — seven seats, with balance as horizontal distance</title>
<desc id="mdesc">A pole-to-pole axis with a semicircular arc bulging right. Seven seats sit on the arc. The horizontal distance of each seat from the axis is B = sin theta, so seats with equal balance share a vertical, L4 is the unique widest point, and L1 and L7 approach but never reach the two non-member boundary poles.</desc>
<style>
  .ink   { fill: #1F1F1D; }
  .muted { fill: #6B6B66; }
  .hair  { stroke: #C9C7C0; }
  .spine { stroke: #6B6B66; }
  .teal  { fill: #0F6E56; }
  .purp  { fill: #534AB7; }
  .ring  { fill: none; stroke: #6B6B66; }
  text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .t  { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; }
  @media (prefers-color-scheme: dark) {
    .ink   { fill: #F5F5F3; }
    .muted { fill: #9A9D9F; }
    .hair  { stroke: rgba(245,245,243,.16); }
    .spine { stroke: #9A9D9F; }
    .teal  { fill: #5DCAA5; }
    .purp  { fill: #AFA9EC; }
    .ring  { stroke: #9A9D9F; }
  }
</style>
