    {"card_id":"SES01-01","chapters":["review"],"locator":{"section":"Part I","line_start":1,"line_end":112},"plain_claim":"Hostile review and explicit limits should precede reuse.","claim_type":"stipulation","evidence":[{"tier":"S","scope":"chosen review protocol"}],"owner_ids":["K-5","K-7"],"dependencies":[],"docket_ids":["A0","A3"],"type_boundaries":["review occurrence is not safety or truth"],"strongest_rival":"Ordinary independent peer review may be stronger.","discriminator":"Compare objection discovery and correction with outside review.","kill_criterion":"Narrow if hostile review is ritualized or suppresses non-framework objections.","survivor_if_killed":"Claims need explicit limits and critics.","consequence":{"applicable":true,"bearers":["authors","critics","affected parties"],"consent":"critics need not adopt the vocabulary","reversibility":"review is revisable","exit":"criticism carries no loyalty requirement"},"disposition":"restate","public":{"state":"source_only","wording":"Hostile review is a sensor, never a safety certificate."},"review":{"state":"l3_audited","receipts":["13_BOOKS/self_eating_serpent/DEBRIEF.md"]}},
