abstract: |
  Yves R. Burri proposes EUB-1 v1.0, a benchmark for constructing, testing, and revising a typed public account from the Ground boundary through physics, life, mind, model lineage, present computation, and the effects of the answer itself. Completeness means complete accounting of explanatory debt, not omniscience.
